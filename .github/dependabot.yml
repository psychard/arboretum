version: 2

# The actions in the workflows are pinned to commit SHAs. Dependabot reads the
# `# vX.Y.Z` comment beside each pin and moves the hash and the comment
# together, which is the convention pages.yml relies on staying true.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR for all of them: the Pages actions have compatibility rules
    # between them, so they are reviewed together.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # The build and test tools move together; they rarely break the game.
      tooling:
        patterns: ["vite", "vitest", "typescript", "prettier"]
    ignore:
      # three.js stays on r128 until someone upgrades it on purpose: newer
      # releases change colour management and light intensities, which shifts
      # the painted look. @types/three has to match it.
      - dependency-name: "three"
      - dependency-name: "@types/three"
    labels:
      - dependencies

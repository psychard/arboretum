name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop superseded ones rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to a commit SHA, not a tag: a tag is mutable, so `@v7` is a
# promise from whoever can move it. The trailing comment is the only thing that
# says which release a SHA is, so move the two together or the next person is
# reading a hash. Re-resolve with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# The same pins as psychard/stickman-climb, so Dependabot moves both repos in
# step.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # setup-node v5 started caching automatically off package.json's
          # `packageManager` field. We have no such field, so this explicit
          # line is still what turns the cache on.
          cache: npm

      - run: npm ci

      # The save-format tests: a change that would lose someone's garden on
      # load fails here, before it ships.
      - run: npm test

      # Typechecks, then bundles into dist/.
      - run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Only the build goes up: dist/ holds the bundle plus public/ (icons,
      # manifest, fonts) copied as is.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

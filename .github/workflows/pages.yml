name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop superseded ones rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to a commit SHA, not a tag: a tag is mutable, so `@v7` is a
# promise from whoever can move it. The trailing comment is the only thing that
# says which release a SHA is, so move the two together or the next person is
# reading a hash. Re-resolve with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# The same pins as psychard/stickman-climb, so Dependabot moves both repos in
# step.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build step: the game is index.html as written. The runner's own Node
      # is enough to parse it, so there is no setup-node and nothing to install.
      - run: node tools/check.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The repo root is the site. v4+ leaves dotfiles out of the artifact,
      # which is what we want here: .github/ and .claude/ stay unpublished.
      # README.md and tools/ do go up; they are harmless and not linked.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

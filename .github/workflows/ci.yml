name: CI

# Checks a pull request before it is merged. pages.yml owns push-to-main and
# does the deploying; this one never deploys, so the two never overlap. It
# exists so a Dependabot PR (action pins or npm packages) arrives with the same
# tests and build the deploy runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read the code and nothing else; this job has no business deploying.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a SHA with the release in the comment, as in pages.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
